apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: bigintensive
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: bigintensive
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      volumes:
        - name: schema
          configMap:
            name: postgresql-schema
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: bigintensive-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bigintensive-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: bigintensive-config
                  key: POSTGRES_DB
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: schema
              mountPath: /docker-entrypoint-initdb.d/01-schema.sql
              subPath: schema.sql
              readOnly: true
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 500Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-schema
  namespace: bigintensive
data:
  schema.sql: |
    CREATE TABLE IF NOT EXISTS athletes (
      id SERIAL PRIMARY KEY,
      nome VARCHAR(100) NOT NULL,
      cognome VARCHAR(100) NOT NULL,
      data_di_nascita DATE NOT NULL,
      sesso VARCHAR(10) CHECK (sesso IN ('M', 'F')),
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS anthropometric_values (
      athlete_id INT NOT NULL REFERENCES athletes(id) ON DELETE CASCADE,
      altezza_cm INT CHECK (altezza_cm > 50 AND altezza_cm < 300),
      peso_kg DECIMAL(5, 2) CHECK (peso_kg > 10 AND peso_kg < 500),
      data_rilevazione DATE NOT NULL,
      PRIMARY KEY (athlete_id, data_rilevazione)
    );

    CREATE TABLE IF NOT EXISTS allenamenti (
      id SERIAL PRIMARY KEY,
      athlete_id INT NOT NULL REFERENCES athletes(id) ON DELETE CASCADE,
      data_allenamento DATE NOT NULL,
      tipo_allenamento VARCHAR(50) CHECK (tipo_allenamento IN ('forza', 'endurance', 'mobilità')),
      durata_minuti INT CHECK (durata_minuti > 0),
      struttura_allenamento JSONB,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS riepilogo_corse (
      id SERIAL PRIMARY KEY,
      athlete_id INT NOT NULL REFERENCES athletes(id) ON DELETE CASCADE,
      velocita_media DECIMAL(5, 2) CHECK (velocita_media > 0),
      velocita_max DECIMAL(5, 2) CHECK (velocita_max > 0),
      frequenza_media DECIMAL(5, 2) CHECK (frequenza_media > 0),
      frequenza_max DECIMAL(5, 2) CHECK (frequenza_max > 0),
      cadenza DECIMAL(5, 2) CHECK (cadenza > 0),
      distanza_km DECIMAL(5, 2) CHECK (distanza_km > 0),
      durata_minuti INT CHECK (durata_minuti > 0),
      data_corsa DATE NOT NULL,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS esercizi (
      id SERIAL PRIMARY KEY,
      nome_esercizio VARCHAR(150) NOT NULL,
      descrizione TEXT,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS training_status_results (
      id SERIAL PRIMARY KEY,
      athlete_id INT NOT NULL REFERENCES athletes(id) ON DELETE CASCADE,
      result_date DATE NOT NULL,
      valore DECIMAL(5, 2),
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
