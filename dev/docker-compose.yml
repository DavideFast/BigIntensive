name: bigintensive-spark

services:
  spark-master:
    image: davidefast/bigintensive-sparkwithdependencies:latest
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ../streaming/spark/jobs:/opt/spark-apps
    networks:
      - spark-net

  spark-worker-1:
    image: apache/spark:3.5.0
    container_name: spark-worker-1
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY:-2G}
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES:-2}
      - SPARK_WORKER_WEBUI_PORT=8081
    ports:
      - "8081:8081"
    volumes:
      - ../streaming/spark/jobs:/opt/spark-apps
    networks:
      - spark-net

  spark-worker-2:
    image: apache/spark:3.5.0
    container_name: spark-worker-2
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY:-2G}
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES:-2}
      - SPARK_WORKER_WEBUI_PORT=8082
    ports:
      - "8082:8082"
    volumes:
      - ../streaming/spark/jobs:/opt/spark-apps
    networks:
      - spark-net

  jupyter:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: spark-jupyter
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - PYSPARK_SUBMIT_ARGS=--master spark://spark-master:7077 pyspark-shell
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-changeme}
    command: start-notebook.py --ServerApp.token=${JUPYTER_TOKEN:-changeme}
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      - ../streaming/spark:/home/jovyan/work
    networks:
      - spark-net

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-bigintensive}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../database/postgresql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - spark-net

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:${KAFKA_EXTERNAL_PORT:-9094}
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9094}:9092"
    volumes:
      - ../streaming/kafka/data:/bitnami/kafka
    networks:
      - spark-net

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    depends_on:
      - kafka
    environment:
      - KAFKA_CLUSTERS_0_NAME=bigintensive-local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:19092
    ports:
      - "${KAFKA_UI_PORT:-8088}:8080"
    networks:
      - spark-net

  clickhouse:
    image: clickhouse/clickhouse-server:24.1
    container_name: clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_DB: bigintensive
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ../database/clickhouse/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - spark-net

  backend:
    image: davidefast/bigintensive-backend:latest
    container_name: backend
    depends_on:
      - postgres
      - kafka
      - clickhouse
    environment:
      - PORT=3001
      - CORS_ORIGIN=http://localhost:${FRONTEND_PORT:-5173}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-bigintensive}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - KAFKA_BOOTSTRAP_SERVERS=kafka:19092
      - PYTHON_BIN=python3
      - K6_DOCKER_NETWORK=bigintensive-spark_spark-net
      - K6_DOCKER_VOLUME=bigintensive-spark_k6-shared
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - k6-shared:/k6-shared
      - ./scripts/k6-backend.js:/app/backend/scripts/k6-backend.js:ro
    networks:
      - spark-net

  frontend:
    image: davidefast/bigintensive-frontend:latest
    container_name: frontend
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:${BACKEND_PORT:-3001}
      - VITE_EVENTS_PATH=/events
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    networks:
      - spark-net

  kafka-consumer:
    build:
      context: ../streaming/kafka/consumer
      dockerfile: Dockerfile
    container_name: kafka-consumer-realtime
    depends_on:
      - kafka
      - postgres
      - clickhouse
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:19092
      - CLICKHOUSE_URL=jdbc:clickhouse://clickhouse:8123/bigintensive
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
      - POSTGRES_URL=jdbc:postgresql://postgres:5432/bigintensive
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    networks:
      - spark-net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Heart Rate Simulator - Genera dati fake per test/demo
  heart-rate-simulator:
    build:
      context: ../services
      dockerfile: Dockerfile.simulator
    container_name: heart-rate-simulator
    depends_on:
      - backend
    environment:
      - ENDPOINT_URL=http://backend:3001/api/v1/pushToKafka
      - NUM_ATHLETES=${NUM_ATHLETES:-20000}
      - SAMPLE_INTERVAL=${SAMPLE_INTERVAL:-5.0}
    networks:
      - spark-net
    restart: unless-stopped
    profiles:
      - simulator
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  k6:
    image: grafana/k6:0.53.0
    container_name: bigintensive-k6
    profiles:
      - loadtest
    depends_on:
      - backend
    working_dir: /scripts/load
    volumes:
      - ./scripts/k6-backend.js:/scripts/load/k6-backend.js:ro
    networks:
      - spark-net
    entrypoint: ["k6"]

networks:
  spark-net:
    driver: bridge

volumes:
  k6-shared:
  postgres-data:
  clickhouse-data:
